name: ISA state feeds
on:
  schedule:
    - cron: "0 6 * * 1"          # 06:00 UTC every Monday (01:00 Jamaica)
  workflow_dispatch:
    inputs:
      feed:
        description: "Which feed"
        default: "all"
        type: choice
        options: [all, clcs, unclos, agreement-1994]
      mode:
        description: "normal = publish changes only | init = record baseline, publish nothing | publish-all = publish every State | dry-run = write docs/<feed>/values.csv only | test-one = publish one State"
        default: "normal"
        type: choice
        options: [normal, init, publish-all, dry-run, test-one]
      only:
        description: "test-one mode: the list Title to publish"
        default: "[S59] France"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          FEED="${{ github.event.inputs.feed || 'all' }}"
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          case "$MODE" in
            init)        python feeds.py $FEED --init ;;
            publish-all) python feeds.py $FEED --publish-all ;;
            dry-run)     python feeds.py $FEED --dry-run ;;
            test-one)    python feeds.py $FEED --only "${{ github.event.inputs.only }}" ;;
            *)           python feeds.py $FEED ;;
          esac
      - name: Commit results (also keeps the schedule alive)
        if: always()             # a failed feed must not discard the others' results
        run: |
          git config user.name "feeds-bot"; git config user.email "feeds-bot@users.noreply.github.com"
          git add -A data docs
          git commit -m "Feeds check $(date -u +%F)" || echo "nothing to commit"
          git push
