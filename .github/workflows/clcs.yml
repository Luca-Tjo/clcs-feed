name: CLCS submissions check
on:
  schedule:
    - cron: "0 6 * * 1"          # 06:00 UTC every Monday (01:00 Jamaica)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = publish changes only | init = record baseline, publish nothing | publish-all = publish every State | dry-run = write docs/values.csv only"
        default: "normal"
        type: choice
        options: [normal, init, publish-all, dry-run, test-one]
      only:
        description: "test-one mode: the list Title to publish"
        default: "[S59] France"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "init" ]; then python clcs_feed.py --init
          elif [ "$MODE" = "publish-all" ]; then python clcs_feed.py --publish-all
          elif [ "$MODE" = "dry-run" ]; then python clcs_feed.py --dry-run
          elif [ "$MODE" = "test-one" ]; then python clcs_feed.py --only "${{ github.event.inputs.only }}"
          else python clcs_feed.py; fi
      - name: Commit results (also keeps the schedule alive)
        run: |
          git config user.name "clcs-bot"; git config user.email "clcs-bot@users.noreply.github.com"
          git add -A docs; for f in state.json needs_review.txt last_run.txt; do [ -f "$f" ] && git add "$f" || true; done
          git commit -m "CLCS check $(date -u +%F)" || echo "nothing to commit"
          git push
